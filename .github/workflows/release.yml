name: Release

# Builds installers for macOS (dmg), Linux (deb / AppImage) and Windows (msi / nsis)
# when a tag like v0.1.0 is pushed, and attaches them to a GitHub Release.
# Binaries are unsigned: macOS users need "Open Anyway" (or
# `xattr -d com.apple.quarantine Pide.app`), Windows shows SmartScreen once.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Create the draft release once so the matrix jobs cannot race into duplicates.
  create-release:
    name: Create draft release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches Cargo version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(grep -m1 '^version' Cargo.toml | sed -E 's/^version *= *"([^"]+)".*/\1/')
          if [ "$tag" != "$ver" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo workspace version $ver"
            exit 1
          fi
      - name: Create draft release
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BODY: "Unsigned builds. macOS: right-click → Open (or `xattr -d com.apple.quarantine Pide.app`). Windows: SmartScreen → More info → Run anyway. Python 3.10+ with `ipykernel` is required at runtime."
        run: |
          # Reuse an existing draft for this tag (re-runs), otherwise create it.
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq "[.[] | select(.tag_name == \"$GITHUB_REF_NAME\" and .draft)][0].id // empty")
          if [ -z "$id" ]; then
            id=$(gh api "repos/$GITHUB_REPOSITORY/releases" -X POST \
              -f tag_name="$GITHUB_REF_NAME" -f name="Pide $GITHUB_REF_NAME" -f body="$BODY" \
              -F draft=true -F prerelease=false --jq .id)
          fi
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: create-release
    # create-release is skipped for manual runs; build anyway (artifacts only).
    if: ${{ !cancelled() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS (Apple Silicon)
            target: aarch64-apple-darwin
          - os: macos-latest  # cross-built from Apple Silicon (macos-13 runners are retired)
            name: macOS (Intel)
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            name: Linux (x86_64)
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            name: Windows (x86_64)
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Linux webkit deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
        working-directory: apps/desktop
      - name: Build installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          args: --target ${{ matrix.target }}
          # Only upload to the pre-created release for tag pushes; manual runs keep artifacts below.
          releaseId: ${{ needs.create-release.outputs.release_id }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pide-${{ matrix.target }}
          if-no-files-found: ignore
          path: |
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            target/${{ matrix.target }}/release/bundle/msi/*.msi
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
