name: Release

# Builds installers for macOS (dmg), Linux (deb / AppImage) and Windows (msi / nsis)
# when a tag like v0.1.0 is pushed, and attaches them to a GitHub Release.
# Binaries are unsigned: macOS users need "Open Anyway" (or
# `xattr -d com.apple.quarantine Pide.app`), Windows shows SmartScreen once.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS (Apple Silicon)
            target: aarch64-apple-darwin
          - os: macos-13
            name: macOS (Intel)
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            name: Linux (x86_64)
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            name: Windows (x86_64)
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Linux webkit deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
        working-directory: apps/desktop
      - name: Build installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          args: --target ${{ matrix.target }}
          # Only create / upload a release for tag pushes; manual runs keep artifacts below.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('Pide {0}', github.ref_name) || '' }}
          releaseBody: "Unsigned builds. macOS: right-click → Open (or `xattr -d com.apple.quarantine Pide.app`). Windows: SmartScreen → More info → Run anyway. Python 3.10+ with `ipykernel` is required at runtime."
          releaseDraft: true
          prerelease: false
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pide-${{ matrix.target }}
          if-no-files-found: ignore
          path: |
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            target/${{ matrix.target }}/release/bundle/msi/*.msi
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
