name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python helper (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest numpy pandas
      - run: python -m pytest python/tests -q

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kernel for the smoke test
        run: pip install ipykernel numpy
      - uses: Swatinem/rust-cache@v2
      - name: Linux webkit deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
        working-directory: apps/desktop
      - name: Typecheck and bundle frontend
        run: npm run build
        working-directory: apps/desktop
      - run: cargo test -p kernel-client
      - name: Kernel smoke test (launch, snapshot, interrupt, shutdown)
        run: cargo run -p kernel-client --example smoke -- python
        env:
          RUST_LOG: kernel_client=info
      - run: cargo build -p pide-desktop
