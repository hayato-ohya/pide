[workspace]
resolver = "2"
members = ["crates/kernel-client", "apps/desktop/src-tauri"]

[workspace.package]
edition = "2021"
version = "0.1.1"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
